<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MBTI Personality Test</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>MBTI Personality Test</h1>
        <p>Answer the following 20 questions to discover your personality type.</p>
    </header>

    <main id="quiz-container">
        <!-- الأسئلة ستظهر هنا باستخدام JavaScript -->
    </main>

    <div id="submit-section" style="display: none;">
        <button onclick="submitQuiz()">Submit</button>
    </div>

    <div id="loading" style="display: none;">
        <p>Analyzing your answers...</p>
    </div>

    <div id="result" style="display: none;">
        <h2>Your Personality Type:</h2>
        <p id="result-text"></p>
    </div>
</body>
</html>
